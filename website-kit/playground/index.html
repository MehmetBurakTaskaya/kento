<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- A page to try the playground on its own, in English and Turkish, light and dark. It pulls in
     playground.html, the very file the website embeds, so open it through a local web server
     (website-kit/README.md). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kento – try the wheel</title>
  <meta name="description" content="Kento’s Convert wheel in the browser: drag a picture with Shift held and drop it on a slice. Nothing is uploaded.">
  <style>
    :root {
      --bg: #f2f3f5;
      --surface: #ffffff;
      --border: #dcdfe4;
      --text: #15181c;
      --muted: #555c67;
      --accent: #2a4ea6;
      --focus: #2a4ea6;
      --keycap: #e8ebef;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181b;
        --surface: #1f2226;
        --border: #32373e;
        --text: #eef0f3;
        --muted: #a3abb6;
        --accent: #89a7f5;
        --focus: #a3bbff;
        --keycap: #30353c;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181b;
      --surface: #1f2226;
      --border: #32373e;
      --text: #eef0f3;
      --muted: #a3abb6;
      --accent: #89a7f5;
      --focus: #a3bbff;
      --keycap: #30353c;
      color-scheme: dark;
    }
    html:lang(tr) [data-l="en"],
    html:not(:lang(tr)) [data-l="tr"] {
      display: none !important;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Variable", "IBM Plex Sans", system-ui, "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .wrap { max-inline-size: 960px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
    header { border-block-end: 1px solid var(--border); background: var(--surface); }
    header .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; min-block-size: 60px; padding-block: 8px; }
    .brand { margin-inline-end: auto; color: var(--text); font-weight: 600; text-decoration: none; }
    .switch { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 6px; }
    .switch button {
      min-block-size: 32px;
      padding: 2px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .switch button[aria-pressed="true"] { background: var(--keycap); color: var(--text); font-weight: 600; }
    main { padding-block: 24px 48px; }
    footer { padding-block: 0 40px; color: var(--muted); font-size: 0.9375rem; }
    .include-missing { padding: 18px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="../index.html">Kento</a>
      <div class="switch" role="group" aria-label="Language / Dil">
        <button type="button" data-set-lang="en" lang="en" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="tr" lang="tr" aria-pressed="false">TR</button>
      </div>
      <div class="switch" role="group" aria-label="Theme / Tema">
        <button type="button" data-set-theme="" aria-pressed="true"><span data-l="en">System</span><span data-l="tr">Sistem</span></button>
        <button type="button" data-set-theme="light" aria-pressed="false"><span data-l="en">Light</span><span data-l="tr">Açık</span></button>
        <button type="button" data-set-theme="dark" aria-pressed="false"><span data-l="en">Dark</span><span data-l="tr">Koyu</span></button>
      </div>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div data-include="playground.html"><p class="include-missing"><a href="playground.html">playground.html</a></p></div>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <span data-l="en">Made by Mehmet Burak Taşkaya</span><span data-l="tr">Mehmet Burak Taşkaya tarafından yapıldı</span>
      · <a href="https://github.com/MehmetBurakTaskaya/kento"><span data-l="en">Source code on GitHub</span><span data-l="tr">GitHub’daki kaynak kodu</span></a>
    </div>
  </footer>
  <script>
    // The page's language (?lang=tr, else the browser's) and theme (?theme=light or dark, else the
    // system's), switched by the buttons as the website switches them: <html lang> and data-theme.
    (function () {
      var params = new URLSearchParams(location.search);
      var root = document.documentElement;
      function setLang(lang) {
        root.lang = lang;
        document.title = lang === 'tr' ? 'Kento – çarkı deneyin' : 'Kento – try the wheel';
        [].forEach.call(document.querySelectorAll('[data-set-lang]'), function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === lang));
        });
      }
      function setTheme(theme) {
        if (theme) root.setAttribute('data-theme', theme);
        else root.removeAttribute('data-theme');
        [].forEach.call(document.querySelectorAll('[data-set-theme]'), function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-set-theme') === theme));
        });
      }
      var lang = params.get('lang');
      setLang(lang === 'tr' || lang === 'en' ? lang : /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en');
      var theme = params.get('theme');
      setTheme(theme === 'light' || theme === 'dark' ? theme : '');
      document.addEventListener('click', function (event) {
        var l = event.target.closest('[data-set-lang]');
        var t = event.target.closest('[data-set-theme]');
        if (l) setLang(l.getAttribute('data-set-lang'));
        if (t) setTheme(t.getAttribute('data-set-theme'));
      });

      // The section is fetched and put in place, and its script runs as it would on the website.
      [].forEach.call(document.querySelectorAll('[data-include]'), function (slot) {
        fetch(slot.getAttribute('data-include'))
          .then(function (response) {
            if (!response.ok) throw new Error(String(response.status));
            return response.text();
          })
          .then(function (html) {
            slot.innerHTML = html;
            [].forEach.call(slot.querySelectorAll('script'), function (old) {
              var script = document.createElement('script');
              script.textContent = old.textContent;
              old.replaceWith(script);
            });
          })
          .catch(function () { /* the link to the file stays */ });
      });
    })();
  </script>
</body>
</html>
