summary: {en: "A file converter and toolbox for Windows and macOS. While a file is being dragged, a modifier key opens a steel dial under the pointer; dropping the file on a slice converts, compresses, or edits it, or shares, copies, or moves it. Kento handles pictures, video, audio, documents, spreadsheets, presentations, subtitles, PDF files, and archives, and adds a shelf, web media downloads, folder rules and recipes, background removal, text recognition, and a command line. Everything runs on the computer: no account, no cloud, and no telemetry.", tr: "Windows ve macOS için bir dosya dönüştürücü ve araç kutusu. Bir dosya sürüklenirken bir değiştirici tuş, imlecin altında çelik bir kadran açar; dosya bir dilime bırakıldığında dönüştürülür, sıkıştırılır ya da düzenlenir, paylaşılır, kopyalanır ya da taşınır. Kento görseller, video, ses, belgeler, tablolar, sunumlar, altyazılar, PDF dosyaları ve arşivlerle çalışır; bunlara bir raf, web’den medya indirme, klasör kuralları ve tarifler, arka plan kaldırma, metin tanıma ve bir komut satırı eklenir. Her şey bilgisayarda çalışır: hesap, bulut ya da telemetri yok."}
role: {en: "I designed and built it, and I maintain it.", tr: "Tasarladım, geliştirdim ve bakımını yapıyorum."}
