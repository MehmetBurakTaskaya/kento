# cargo-deny configuration: licences and advisories of the Rust dependencies.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # paste: a compile-time macro of the AV1 codecs, unmaintained but with no known flaw and no successor in use there.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro of rav1d and rav1e; no replacement upstream yet" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
# The allow-list is policy, not an inventory: entries may be unused today.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
