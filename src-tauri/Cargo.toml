[package]
name = "kento"
version = "1.0.2"
description = "Drag a file, press a modifier key, drop it on the wheel: local file conversion and tools."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
repository = "https://github.com/MehmetBurakTaskaya/kento"
edition = "2021"
publish = false
default-run = "kento"

[lib]
name = "kento_lib"
crate-type = ["rlib"]

[[bin]]
name = "kento"
path = "src/main.rs"

# Writes docs/FORMATS.md and website-kit/catalog.json from the catalog (npm run catalog:export).
# A tool for the repository, not for users: behind a feature of its own, so `tauri build` neither
# builds it nor packs it beside the app, which it does with every binary it builds.
[[bin]]
name = "catalog-export"
path = "src/bin/catalog_export.rs"
required-features = ["catalog-export"]

# The command line (`kento convert …`): a console program beside the app, which stays a GUI
# program. Installed as kento.com next to kento.exe on Windows, so a terminal finds it first.
[[bin]]
name = "kento-cli"
path = "src/bin/kento_cli.rs"

[workspace]
members = ["engines"]

[features]
catalog-export = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
kento-engines = { path = "engines" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.6"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.5.5"
# Updates (SPEC 5.16), used from Rust only: the page has no updater permission. Updates arrive as
# the installer itself, the app archive or Kento's own portable ZIP, so the plugin needs no archive
# support of its own.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
drag = "2.1.1"
# Folder automation (SPEC 5.11): the system's own change notifications (ReadDirectoryChangesW on
# Windows, FSEvents on macOS).
notify = "8.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The command line finds the data and Downloads folders without the app (Tauri uses the same).
dirs = "6.0.0"
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# Tool downloads (src/toolchain): rustls with the ring provider (no aws-lc, so no NASM or CMake)
# and the system's certificate store; zip, 7z and tar.gz (the engines' own tar and flate2) only to
# take the pinned binaries out.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24.2", default-features = false }
tar = "0.4.46"
flate2 = "1.1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# The share data needs an IIterable, which the windows crate uses from here without re-exporting.
windows-collections = "0.3.2"
# The `implement` macro (Kento's OLE drop target) names this crate in the code it writes.
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Ctrl+C on the command line (SIGINT, SIGTERM) cancels the job instead of killing it half-way.
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSEvent", "NSHapticFeedback", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSSharingService", "NSView", "NSWindow", "NSWorkspace"] }
# Window layouts: the Accessibility API (AXUIElement) and the CoreFoundation values it takes.
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleScript", "NSArray", "NSDictionary", "NSGeometry", "NSString", "NSURL", "NSValue", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
# The update tests make a key pair, sign packages the way `tauri signer sign` does and check them
# with the updater plugin in a mock app; the plugin takes keys and signatures in base64.
minisign = "0.10.0"
base64 = "0.23.1"
tauri = { version = "2.12.5", features = ["test"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
# The toolchain tests build 7z archives.
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["compress", "util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Unwinding, not abort: a parser that panics on a malformed file ends that job, not Kento.
