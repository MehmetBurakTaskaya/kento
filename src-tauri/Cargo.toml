[package]
name = "kento"
version = "0.1.0"
description = "Drag a file, press a modifier key, drop it on the wheel: local file conversion and tools."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
repository = "https://github.com/MehmetBurakTaskaya/kento"
edition = "2021"
publish = false
default-run = "kento"

[lib]
name = "kento_lib"
crate-type = ["rlib"]

[[bin]]
name = "kento"
path = "src/main.rs"

# Writes docs/FORMATS.md and website-kit/catalog.json from the catalog (npm run catalog:export).
[[bin]]
name = "catalog-export"
path = "src/bin/catalog_export.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
