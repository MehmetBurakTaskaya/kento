[package]
name = "kento-engines"
version = "0.1.0"
description = "Kento's local conversion engines: images, PDF, archives, text, subtitles, spreadsheets and QR codes."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
repository = "https://github.com/MehmetBurakTaskaya/kento"
edition = "2021"
publish = false

[lib]
name = "kento_engines"

[dependencies]
thiserror = "2"
tracing = "0.1.44"

# Images
image = { version = "0.25.10", default-features = false, features = ["rayon", "avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
resvg = "0.49.0"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2.1.0"
yuv = "0.8.20"
webp = { version = "0.3.1", default-features = false }

# PDF
pdfium-render = "0.9.5"
lopdf = "0.46.0"

# Archives
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
sevenz-rust2 = "0.24.2"
unrar = "0.5.8"

# Text, subtitles, spreadsheets and QR codes
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
calamine = "0.37.0"
rust_xlsxwriter = "0.102.0"
csv = "1.4"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
htmd = "0.5.6"
html2text = "0.17.4"
encoding_rs = "0.8.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
