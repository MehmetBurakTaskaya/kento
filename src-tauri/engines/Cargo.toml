[package]
name = "kento-engines"
version = "0.1.0"
description = "Kento's local conversion engines: images, PDF, archives, text, subtitles, spreadsheets and QR codes."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
repository = "https://github.com/MehmetBurakTaskaya/kento"
edition = "2021"
publish = false

[lib]
name = "kento_engines"

[dependencies]
thiserror = "2"
tracing = "0.1.44"

# Images
image = { version = "0.25.10", default-features = false, features = ["rayon", "avif", "bmp", "color_quant", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
resvg = "0.49.0"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2.1.0"
yuv = "0.8.20"
webp = { version = "0.3.1", default-features = false }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
libc = "0.2.191"
# Compress: palette PNGs (NeuQuant, which the `color_quant` feature above lets image's dithering
# use) and deflated TIFFs, which image's own encoders do not write. All three were already in the
# tree through `image`.
color_quant = "1.1.0"
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }

# PDF
# The API features match the bundled PDFium (pdfium-binaries chromium/8125); thread_safe
# serialises every PDFium call, since several jobs run at once.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
lopdf = { version = "0.46.0", default-features = false, features = ["rayon"] }

# Archives
# Reading also takes the methods other tools write (Deflate64 from Windows, BZIP2 and LZMA).
zip = { version = "9.2.1", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
tar = "0.4.46"
flate2 = "1.1.10"
sevenz-rust2 = "0.24.2"
# The UnRAR library itself (the `unrar` crate's sys layer): its test mode streams each entry to a
# callback, so the library never writes files or links of its own.
unrar_sys = "0.5.8"

# Text, subtitles, spreadsheets and QR codes
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
# Making QR codes: only the encoder; Kento draws the PNG and SVG itself.
qrcode = { version = "0.14.1", default-features = false }
calamine = "0.37.0"
rust_xlsxwriter = "0.102.0"
csv = "1.4"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
htmd = "0.5.6"
html2text = "0.17.4"
encoding_rs = "0.8.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = { version = "1.10.3", default-features = false }
# Office: EPUB's container.xml and package document (already in the tree through resvg).
roxmltree = "0.21.2"

# Background removal: ONNX Runtime is loaded at run time from the copy the Extras tools installed,
# so nothing is downloaded or linked when Kento is built. API 23 is ONNX Runtime 1.23, the last
# release with Intel Mac builds; every later release serves it too. Pinned exactly: release
# candidates change their API.
# The model answers in half precision.
half = "2"
# Only to read why ONNX Runtime fails to load; ort loads it through the same crate.
libloading = "0.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23", "tracing", "half"] }

# Images: HEIC through the system codecs (WIC on Windows; ImageIO on macOS needs no crate).
# Media: FFmpeg runs in a job object, so cancelling ends what it started.
# OCR: Windows.Media.Ocr reads a SoftwareBitmap filled from a buffer, in a Globalization language.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }

# OCR: Apple's Vision (VNRecognizeTextRequest) reading a PNG handed over as NSData.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }

[dev-dependencies]
tempfile = "3.27.0"
