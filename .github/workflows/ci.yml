name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # The pinned PDFium library that ships inside Kento; the build and the PDF tests need it.
      - name: PDFium
        run: npm run pdfium

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run check:i18n
          npm run check:spdx
          npm run check:licenses

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      # All features, so the catalog export (behind a feature of its own) is linted too.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      # FFmpeg and ExifTool for the media and metadata tests, yt-dlp and Deno for finding the web
      # download tools; the app downloads its own pinned builds on request.
      - name: FFmpeg, ExifTool, yt-dlp and Deno
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg exiftool -y --no-progress
            choco install yt-dlp deno -y --no-progress
            # Chocolatey's Deno package puts its folder on the PATH of new shells only; this step
            # and the later ones get it here.
            deno_dir=$(dirname "$(find /c/ProgramData/chocolatey/lib/deno -name deno.exe | head -1)")
            cygpath -w "$deno_dir" >> "$GITHUB_PATH"
            export PATH="$deno_dir:$PATH"
          else
            brew install ffmpeg exiftool
            brew install yt-dlp deno
          fi
          ffmpeg -hide_banner -version | head -1
          exiftool -ver
          echo "yt-dlp $(yt-dlp --version)"
          DENO_NO_UPDATE_CHECK=1 deno --version

      # LibreOffice for the office tests and for finding an installed copy. On Windows soffice.exe
      # prints nothing, so its console twin soffice.com answers. Its own Python runs Kento's client
      # for the LibreOffice kept between jobs; without it each job starts LibreOffice, and the
      # office tests say so.
      - name: LibreOffice
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install libreoffice-fresh -y --no-progress
            "/c/Program Files/LibreOffice/program/soffice.com" --version
            python="/c/Program Files/LibreOffice/program/python.exe"
          else
            brew install --cask libreoffice
            /Applications/LibreOffice.app/Contents/MacOS/soffice --version
            python=/Applications/LibreOffice.app/Contents/Resources/python
          fi
          ls -l "$python" || echo "LibreOffice has no Python of its own here"

      # Background removal: ONNX Runtime and the model (about 300 MB) come from Kento's own installer
      # once, which also removes a test background with them, and are kept in the Actions cache
      # until the lockfile changes; the tests below then find them through KENTO_ONNXRUNTIME and
      # KENTO_BG_MODEL.
      - name: Background removal tools (cached)
        id: bgremove-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kento-tools
          key: bgremove-${{ runner.os }}-${{ hashFiles('src-tauri/toolchain.lock.json') }}

      - name: Background removal tools
        if: steps.bgremove-cache.outputs.cache-hit != 'true'
        env:
          KENTO_TOOLCHAIN_ROOT: ${{ runner.temp }}/kento-tools
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --lib --
          --ignored installs_the_pinned_extras --nocapture

      - name: Keep the background removal tools
        if: steps.bgremove-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kento-tools
          key: ${{ steps.bgremove-cache.outputs.cache-primary-key }}

      - name: Point the tests at the background removal tools
        run: |
          root="${{ runner.temp }}/kento-tools/extras"
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(cygpath -u "$root"); fi
          runtime=$(find "$root/onnxruntime" -type f \( -name onnxruntime.dll -o -name 'libonnxruntime.*.dylib' \) | head -1)
          model=$(find "$root/bg-model" -type f -name BEN2_Base.onnx | head -1)
          test -n "$runtime" && test -n "$model"
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime=$(cygpath -w "$runtime")
            model=$(cygpath -w "$model")
          fi
          echo "KENTO_ONNXRUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "KENTO_BG_MODEL=$model" >> "$GITHUB_ENV"

      - name: Rust tests
        env:
          KENTO_REQUIRE_BGREMOVE: '1'
          KENTO_REQUIRE_PDFIUM: '1'
          KENTO_REQUIRE_FFMPEG: '1'
          KENTO_REQUIRE_EXIFTOOL: '1'
          KENTO_REQUIRE_SOFFICE: '1'
          KENTO_SOFFICE: ${{ runner.os == 'Windows' && 'C:\Program Files\LibreOffice\program\soffice.exe' || '/Applications/LibreOffice.app/Contents/MacOS/soffice' }}
          # yt-dlp and Deno are on PATH (Chocolatey's shim and Deno's folder added above, Homebrew's
          # bin), so no KENTO_YTDLP or KENTO_DENO is needed.
          KENTO_REQUIRE_YTDLP: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Catalog docs are current
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --features catalog-export --bin catalog-export -- --check

      - name: Build app (no installer)
        run: npm run tauri build -- --no-bundle

      # Starts the release build with a hidden window, checks settings, languages, the catalog, the
      # job queue, the tray and the window, and writes smoke-test.json to the data folder.
      - name: Smoke test
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/target/release/kento.exe --smoke-test
            report="$LOCALAPPDATA/Kento/smoke-test.json"
          else
            ./src-tauri/target/release/kento --smoke-test
            report="$HOME/Library/Application Support/Kento/smoke-test.json"
          fi
          cat "$report"
          grep -q '"passed": true' "$report"

      # The release command line (kento-cli, shipped as kento.com on Windows) as a terminal runs
      # it: a picture with Turkish letters and an emoji in its name converted with a JSON report,
      # compressed, and the exit code of a route Kento does not have.
      - name: Command line
        timeout-minutes: 2
        run: |
          cli=./src-tauri/target/release/kento-cli
          dir="$RUNNER_TEMP/Komut satırı ğüş 🧪"
          mkdir -p "$dir"
          cp src-tauri/icons/128x128.png "$dir/Fotoğraf İı 🧪.png"
          "$cli" --version
          "$cli" convert "$dir/Fotoğraf İı 🧪.png" --to jpg --json | tee "$RUNNER_TEMP/convert.json"
          grep -q '"ok": true' "$RUNNER_TEMP/convert.json"
          test -s "$dir/Fotoğraf İı 🧪.jpg"
          "$cli" tool compress "$dir/Fotoğraf İı 🧪.jpg" --quality 40
          test -s "$dir/Fotoğraf İı 🧪 - compressed.jpg"
          code=0
          "$cli" convert "$dir/Fotoğraf İı 🧪.png" --to mp3 || code=$?
          test "$code" = 3

  cargo-deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      # THIRD-PARTY-NOTICES.md and docs/DEPENDENCIES.md are made from the lockfiles, the PDFium
      # script and the tool lockfile; a dependency change without `npm run third-party` fails here.
      - name: Third-party notices are current
        run: npm run check:third-party
