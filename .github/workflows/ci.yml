name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # The pinned PDFium library that ships inside Kento; the build and the PDF tests need it.
      - name: PDFium
        run: npm run pdfium

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run check:i18n
          npm run check:spdx
          npm run check:licenses

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      # FFmpeg for the media engine's tests; the app downloads its own pinned build on request.
      - name: FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; else brew install ffmpeg; fi
          ffmpeg -hide_banner -version | head -1

      - name: Rust tests
        env:
          KENTO_REQUIRE_PDFIUM: '1'
          KENTO_REQUIRE_FFMPEG: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Catalog docs are current
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --bin catalog-export -- --check

      - name: Build app (no installer)
        run: npm run tauri build -- --no-bundle

      # Starts the release build with a hidden window, checks settings, languages, the catalog, the
      # job queue, the tray and the window, and writes smoke-test.json to the data folder.
      - name: Smoke test
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/target/release/kento.exe --smoke-test
            report="$LOCALAPPDATA/Kento/smoke-test.json"
          else
            ./src-tauri/target/release/kento --smoke-test
            report="$HOME/Library/Application Support/Kento/smoke-test.json"
          fi
          cat "$report"
          grep -q '"passed": true' "$report"

  cargo-deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
