name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # The pinned PDFium library that ships inside Kento; the build and the PDF tests need it.
      - name: PDFium
        run: npm run pdfium

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run check:i18n
          npm run check:spdx
          npm run check:licenses

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      # FFmpeg and ExifTool for the media and metadata tests, yt-dlp and Deno for finding the web
      # download tools; the app downloads its own pinned builds on request.
      - name: FFmpeg, ExifTool, yt-dlp and Deno
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg exiftool -y --no-progress
            choco install yt-dlp deno -y --no-progress
            # Chocolatey's Deno package puts its folder on the PATH of new shells only; this step
            # and the later ones get it here.
            deno_dir=$(dirname "$(find /c/ProgramData/chocolatey/lib/deno -name deno.exe | head -1)")
            cygpath -w "$deno_dir" >> "$GITHUB_PATH"
            export PATH="$deno_dir:$PATH"
          else
            brew install ffmpeg exiftool
            brew install yt-dlp deno
          fi
          ffmpeg -hide_banner -version | head -1
          exiftool -ver
          echo "yt-dlp $(yt-dlp --version)"
          DENO_NO_UPDATE_CHECK=1 deno --version

      # LibreOffice for the office tests and for finding an installed copy. On Windows soffice.exe
      # prints nothing, so its console twin soffice.com answers.
      - name: LibreOffice
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install libreoffice-fresh -y --no-progress
            "/c/Program Files/LibreOffice/program/soffice.com" --version
          else
            brew install --cask libreoffice
            /Applications/LibreOffice.app/Contents/MacOS/soffice --version
          fi

      - name: Rust tests
        env:
          KENTO_REQUIRE_PDFIUM: '1'
          KENTO_REQUIRE_FFMPEG: '1'
          KENTO_REQUIRE_EXIFTOOL: '1'
          KENTO_REQUIRE_SOFFICE: '1'
          KENTO_SOFFICE: ${{ runner.os == 'Windows' && 'C:\Program Files\LibreOffice\program\soffice.exe' || '/Applications/LibreOffice.app/Contents/MacOS/soffice' }}
          # yt-dlp and Deno are on PATH (Chocolatey's shim and Deno's folder added above, Homebrew's
          # bin), so no KENTO_YTDLP or KENTO_DENO is needed.
          KENTO_REQUIRE_YTDLP: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Catalog docs are current
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --bin catalog-export -- --check

      - name: Build app (no installer)
        run: npm run tauri build -- --no-bundle

      # Starts the release build with a hidden window, checks settings, languages, the catalog, the
      # job queue, the tray and the window, and writes smoke-test.json to the data folder.
      - name: Smoke test
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/target/release/kento.exe --smoke-test
            report="$LOCALAPPDATA/Kento/smoke-test.json"
          else
            ./src-tauri/target/release/kento --smoke-test
            report="$HOME/Library/Application Support/Kento/smoke-test.json"
          fi
          cat "$report"
          grep -q '"passed": true' "$report"

  cargo-deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
